<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Paladin | Partner Access</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f1117;
            --ink-panel: #1a1d27;
            --ink-line: #2a2e3d;
            --fog: #e8e6e1;
            --fog-dim: #8b8fa3;
            --blue: #4a9eed;
            --amber: #fb923c;
            --green: #34d399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
            background:
                radial-gradient(ellipse 900px 520px at 78% -10%, rgba(74, 158, 237, 0.13), transparent 60%),
                var(--ink);
            color: var(--fog);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .gate {
            width: 100%;
            max-width: 420px;
            background: var(--ink-panel);
            border: 1px solid var(--ink-line);
            border-radius: 10px;
            box-shadow: 0 16px 40px -8px rgba(15, 17, 23, 0.35);
            overflow: hidden;
            transform: rotate(-0.6deg);
        }
        .gate-chrome {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--ink-line);
            background: rgba(15, 17, 23, 0.55);
        }
        .dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--green);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
            50% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
        }
        .gate-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em; }
        .gate-meta { font-size: 0.62rem; color: var(--fog-dim); margin-left: auto; letter-spacing: 0.08em; }
        .gate-body { padding: 26px 22px 28px; }
        .gate-line {
            font-size: 0.72rem;
            line-height: 1.8;
            color: var(--fog-dim);
            letter-spacing: 0.04em;
            margin-bottom: 1.3rem;
        }
        .gate-line strong { color: var(--fog); font-weight: 600; }
        label {
            display: block;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: var(--fog-dim);
            margin-bottom: 0.5rem;
        }
        input[type="password"] {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 0.12em;
            color: var(--fog);
            background: rgba(15, 17, 23, 0.55);
            border: 1px solid var(--ink-line);
            border-radius: 6px;
            padding: 0.75rem 0.9rem;
            outline: none;
            transition: border-color 0.25s;
        }
        input[type="password"]:focus { border-color: var(--blue); }
        button {
            width: 100%;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: #fff;
            background: #0a66c2;
            border: none;
            border-radius: 6px;
            padding: 0.85rem;
            margin-top: 1rem;
            cursor: pointer;
            transition: background 0.25s;
        }
        button:hover { background: #0857a6; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .error {
            display: none;
            color: var(--amber);
            border: 1px dashed rgba(251, 146, 60, 0.4);
            border-radius: 6px;
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            padding: 0.6rem 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <main class="gate">
        <div class="gate-chrome">
            <span class="dot"></span>
            <span class="gate-label">PALADIN · PARTNER ACCESS</span>
            <span class="gate-meta">encrypted</span>
        </div>
        <div class="gate-body">
            <p class="gate-line">This file is for <strong>Paladin sales partners</strong>. Enter the passphrase you were given to open the ledger. Don't have one? <strong>inquiries@ashfordbriggs.com</strong></p>
            <form id="gateForm">
                <label for="pass">PASSPHRASE</label>
                <input type="password" id="pass" autocomplete="current-password" autofocus>
                <button type="submit" id="openBtn">OPEN THE FILE</button>
                <p class="error" id="err">&#9873; THAT'S NOT IT — CHECK THE PASSPHRASE</p>
            </form>
        </div>
    </main>

        var ITERATIONS = 310000;
        var form = document.getElementById('gateForm');
        var passInput = document.getElementById('pass');
        var btn = document.getElementById('openBtn');
        var err = document.getElementById('err');

        function b64ToBytes(b64) {
            var bin = atob(b64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        function decrypt(passphrase) {
            var data = b64ToBytes(PAYLOAD);
            var salt = data.slice(0, 16);
            var iv = data.slice(16, 28);
            var ciphertext = data.slice(28);
            var enc = new TextEncoder();
            return crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
                .then(function (baseKey) {
                    return crypto.subtle.deriveKey(
                        { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
                        baseKey,
                        { name: 'AES-GCM', length: 256 },
                        false,
                        ['decrypt']
                    );
                })
                .then(function (key) {
                    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
                })
                .then(function (plainBuf) {
                    return new TextDecoder().decode(plainBuf);
                });
        }

        function open(passphrase, remember) {
            btn.disabled = true;
            decrypt(passphrase).then(function (html) {
                if (remember) {
                    try { sessionStorage.setItem('paladin-partner-pass', passphrase); } catch (e) {}
                }
                document.open();
                document.write(html);
                document.close();
            }).catch(function () {
                btn.disabled = false;
                err.classList.add('show');
                try { sessionStorage.removeItem('paladin-partner-pass'); } catch (e) {}
            });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            err.classList.remove('show');
            open(passInput.value, true);
        });

        // Re-open silently within the same tab session
        try {
            var saved = sessionStorage.getItem('paladin-partner-pass');
            if (saved) open(saved, false);
        } catch (e) {}
    })();
